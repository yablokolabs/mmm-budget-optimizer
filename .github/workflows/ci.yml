name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    name: Skill end to end (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux, prebuilt engine
            os: ubuntu-24.04
          - name: macos, prebuilt engine
            os: macos-14
          - name: linux, engine from source
            os: ubuntu-24.04
            from_source: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install engine with the skill's installer
        env:
          MMM_FROM_SOURCE: ${{ matrix.from_source || '0' }}
        run: echo "MMM=$(bash skills/mmm-budget-optimizer/scripts/install_engine.sh)" >> "$GITHUB_ENV"
      - name: Data checks, fit, optimize, report, plan quality
        run: tests/test_skill.sh
      - name: Zip matches the skill folder
        run: python3 tests/check_zip.py

  video:
    name: Demo video project type-checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: demo-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit -p .
